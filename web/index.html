<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OMSI BIS 관제</title>
<style>
  :root{
    --bg:#eef1f5; --card:#fff; --track:#9db4e0; --ink:#1a2233; --sub:#8a93a6;
    --code:#8a93a6; --green:#1bb56b; --orange:#f08a24; --navy:#12386e;
    --shadow:0 2px 14px #0b214412;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.5 "Malgun Gothic","Segoe UI",system-ui,sans-serif;}
  #app{height:100%;display:flex;flex-direction:column;background:var(--bg);}
  #topnav{display:flex;align-items:center;gap:26px;background:#152a52;color:#fff;
    padding:0 24px;height:54px;flex:none;box-shadow:0 1px 8px #0b214433;z-index:30;}
  #topnav .brand{font-weight:800;font-size:17px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px;}
  #topnav .navlinks{display:flex;gap:26px;margin-left:14px;font-size:14.5px;color:#c7d2ea;}
  #topnav .navlinks span{cursor:pointer;padding:4px 0;}
  #topnav .navlinks span.on,#topnav .navlinks span:hover{color:#fff;font-weight:700;}
  #main{flex:1;display:flex;min-height:0;}
  #main[hidden]{display:none;}
  #side-routes[hidden],#side-stops[hidden]{display:none;}
  #sidebar{width:372px;flex:none;background:var(--card);display:flex;flex-direction:column;
    min-height:0;box-shadow:2px 0 12px #0b21440d;z-index:20;}
  #mappane{flex:1;position:relative;min-width:0;background:#e9edf2;display:flex;}
  header{padding:16px 20px 12px;border-bottom:1px solid #eef0f4;flex:none;}
  .rownum{display:flex;align-items:center;gap:10px;}
  .badge{background:var(--green);color:#fff;font-size:13px;font-weight:700;padding:3px 9px;border-radius:7px;}
  .badge.trunk{background:#2f6bff;}
  .num{font-size:30px;font-weight:800;letter-spacing:-.5px;}
  .ends{margin-top:8px;color:#3b465c;font-weight:600;}
  .summary{margin-top:6px;color:var(--sub);font-size:14px;}
  .summary .run{color:var(--orange);font-weight:700;}
  .refresh{display:flex;justify-content:space-between;align-items:center;
    padding:8px 20px;color:var(--sub);font-size:13px;border-bottom:1px solid #eef0f4;background:#fafbfc;}
  .conn.ok{color:var(--green);} .conn.bad{color:#d5495f;}
  .stops{flex:1;overflow-y:auto;position:relative;padding:6px 0 60px;}
  .stop{position:relative;display:flex;gap:14px;padding:0 20px;min-height:62px;}
  .rail{position:relative;width:28px;flex:none;}
  .rail::before{content:"";position:absolute;top:0;bottom:0;width:4px;background:var(--track);left:12px;}
  .stop:first-child .rail::before{top:24px;}
  .stop:last-child .rail::before{bottom:calc(100% - 24px);}
  .node{position:absolute;top:11px;left:1px;width:26px;height:26px;border-radius:50%;
    background:#fff;border:2px solid var(--track);display:flex;align-items:center;justify-content:center;
    color:#7f93bd;font-size:12px;z-index:2;}
  .info{padding:11px 0;border-bottom:1px solid #f1f3f7;flex:1;}
  .sname{font-weight:700;color:#20293b;}
  .scode{color:var(--code);font-size:13px;margin-top:2px;}
  .bus{position:absolute;left:19px;width:30px;height:30px;z-index:5;color:var(--navy);
    transform:translateY(-50%);transition:top .45s linear;}
  .bus svg{width:30px;height:30px;filter:drop-shadow(0 2px 3px #0b214433);}
  .bus .tag{position:absolute;left:36px;top:50%;transform:translateY(-50%);white-space:nowrap;
    background:var(--navy);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;
    opacity:0;transition:opacity .15s;pointer-events:none;}
  .bus:hover .tag{opacity:1;}
  .eta{flex:none;align-self:center;text-align:right;white-space:nowrap;min-width:0;
    display:flex;flex-direction:column;line-height:1.25;}
  .eta b{font-size:13px;font-weight:700;}
  .eta small{font-size:11.5px;color:#9aa3b2;font-weight:600;}
  .eta.soon b{color:#0f8a4f;} .eta.here b{color:var(--green);}
  .eta.far b{color:#c26a12;}
  .node.next{border-color:var(--green);color:var(--green);animation:nodepulse 1.2s ease-in-out infinite;}
  .node.here{background:var(--green);border-color:var(--green);color:#fff;}
  @keyframes nodepulse{0%,100%{box-shadow:0 0 0 2px #1bb56b33;}50%{box-shadow:0 0 0 7px #1bb56b0f;}}
  .bus.at svg{animation:busbob .7s ease-in-out infinite;}
  @keyframes busbob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  .note{padding:8px 20px;color:#a7863a;background:#fff8e8;font-size:12.5px;border-bottom:1px solid #f2e6c8;}
  .editbtn{margin-left:auto;align-self:center;background:#eef1f6;border:1px solid #dde3ec;
    color:#54607a;font-size:13px;font-weight:700;padding:6px 11px;border-radius:8px;cursor:pointer;}
  .editbtn:hover{background:#e5eaf3;}
  .editbtn.on{background:#e8f0ff;color:#2f6bff;border-color:#b9d0ff;}
  #posbtn{margin-left:auto;} #editbtn{margin-left:6px;}
  #mapsvg.posedit{cursor:move;} #mapsvg.posedit .mapstop{cursor:grab;}
  .posedit .mapstop{opacity:1;}
  .posnote{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:15;display:flex;
    align-items:center;gap:10px;background:#2f6bff;color:#fff;font-size:12.5px;font-weight:700;
    padding:5px 8px 5px 14px;border-radius:20px;box-shadow:0 2px 10px #2f6bff55;white-space:nowrap;}
  #undopos{background:#fff;color:#2f6bff;border:none;font-size:12px;font-weight:700;
    padding:5px 11px;border-radius:16px;cursor:pointer;}
  #undopos:hover{background:#eaf0ff;}
  .modal{position:fixed;inset:0;background:#0b214455;display:flex;justify-content:center;
    align-items:flex-end;z-index:50;}
  .modal[hidden]{display:none;}
  .sheet{background:var(--card);width:100%;max-width:430px;height:88%;border-radius:16px 16px 0 0;
    display:flex;flex-direction:column;box-shadow:0 -4px 24px #0b214433;}
  .sheethead{padding:16px 18px 12px;border-bottom:1px solid #eef0f4;position:relative;}
  .sheethead b{font-size:17px;} .sheethead .sub{display:block;color:var(--sub);font-size:12.5px;margin-top:3px;}
  .xbtn{position:absolute;top:14px;right:14px;border:none;background:#eef1f6;width:30px;height:30px;
    border-radius:8px;font-size:15px;color:#54607a;cursor:pointer;}
  .editfilter{padding:10px 18px;border-bottom:1px solid #eef0f4;}
  .editfilter input{width:100%;padding:9px 12px;border:1px solid #dde3ec;border-radius:9px;font-size:14px;}
  .editlist{flex:1;overflow-y:auto;padding:6px 0 20px;}
  .erow{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid #f3f5f9;}
  .erow .meta{flex:none;width:96px;min-width:96px;}
  .erow .romaji{font-size:12px;color:#8a93a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .erow .eid{font-size:11px;color:#b3bac8;}
  .erow .dir{display:inline-block;font-size:10.5px;font-weight:700;color:#7b8699;background:#eef1f6;
    border-radius:5px;padding:1px 5px;margin-top:2px;}
  .erow input{flex:1;min-width:0;padding:8px 10px;border:1px solid #dde3ec;border-radius:8px;font-size:14px;font-weight:600;color:#20293b;}
  .erow input:focus{outline:none;border-color:#2f6bff;}
  .erow .save{flex:none;background:#2f6bff;color:#fff;border:none;font-size:13px;font-weight:700;
    padding:8px 12px;border-radius:8px;cursor:pointer;}
  .erow .save:disabled{background:#c7d2e6;cursor:default;}
  .erow.saved input{border-color:var(--green);background:#f2fbf6;}
  .dirtabs{display:flex;gap:8px;margin-top:12px;}
  .dirtab{flex:1;text-align:center;padding:8px 0;border-radius:8px;font-weight:700;font-size:14px;
    background:#eef1f6;color:#7b8699;cursor:pointer;border:1px solid transparent;user-select:none;}
  .dirtab.on{background:#e8f0ff;color:#2f6bff;border-color:#b9d0ff;}
  .sidetabs{display:flex;border-bottom:2px solid #eef0f4;flex:none;}
  .sidetab{flex:1;text-align:center;padding:13px 0;font-weight:700;font-size:14px;color:#8a93a6;
    cursor:pointer;user-select:none;border-bottom:2px solid transparent;margin-bottom:-2px;}
  .sidetab.on{color:#152a52;border-bottom-color:#2f6bff;}
  .sidetab.disabled{color:#c7cdd8;cursor:not-allowed;}
  #side-routes,#side-stops{flex:1;display:flex;flex-direction:column;min-height:0;}
  /* home landing */
  .home{max-width:1120px;margin:0 auto;padding:16px 8px;}
  .hometop{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;margin-bottom:8px;}
  .homebrand{font-size:30px;font-weight:800;color:#152a52;letter-spacing:-1px;margin:6px 0 20px;}
  .homesearch{display:flex;align-items:center;gap:10px;border:2px solid #b9c6e6;border-radius:30px;
    padding:6px 6px 6px 22px;background:#fff;box-shadow:var(--shadow);}
  .homesearch input{flex:1;border:none;outline:none;font-size:15px;padding:10px 0;background:transparent;}
  .homesearch button{background:#2f6bff;color:#fff;border:none;width:44px;height:44px;border-radius:50%;
    font-size:18px;cursor:pointer;flex:none;}
  .homehint{color:#9aa3b2;font-size:13px;margin:10px 0 22px;text-align:center;}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .tile{border-radius:16px;padding:26px 20px;color:#fff;cursor:pointer;text-align:center;
    box-shadow:0 4px 16px #0b214422;transition:transform .12s;display:flex;flex-direction:column;
    align-items:center;gap:12px;}
  .tile:hover{transform:translateY(-3px);}
  .tile .ic{font-size:34px;} .tile .tl{font-size:17px;font-weight:800;}
  .tile.search{background:linear-gradient(135deg,#f5992a,#ef7d16);}
  .tile.guide{background:linear-gradient(135deg,#5b9be8,#3d7fd6);}
  .tile.notice{background:linear-gradient(135deg,#5b9be8,#3d7fd6);}
  .tile.tel{background:linear-gradient(135deg,#5b9be8,#3d7fd6);}
  .tile.off{background:linear-gradient(135deg,#c2ccd9,#aab6c6);cursor:not-allowed;}
  .tile.off:hover{transform:none;}
  .herobox{background:linear-gradient(135deg,#6b7a8f,#4a5666);border-radius:16px;min-height:330px;
    display:flex;align-items:center;justify-content:center;color:#fff;padding:26px;box-shadow:var(--shadow);}
  .herobox .h1{font-size:15px;letter-spacing:2px;opacity:.85;} .herobox .h2{font-size:30px;font-weight:800;line-height:1.3;margin-top:8px;}
  .herobox .bus{font-size:80px;margin-bottom:10px;}
  @media (max-width:820px){ .hometop{grid-template-columns:1fr;} .herobox{min-height:200px;} .tiles{grid-template-columns:1fr 1fr;} }
  #stripview{flex:1;display:flex;flex-direction:column;min-height:0;}
  .stopsearchbar{padding:12px 18px;border-bottom:1px solid #eef0f4;border-top:1px solid #eef0f4;}
  .stopsearchbar input{width:100%;padding:10px 12px;border:1px solid #dde3ec;border-radius:22px;font-size:14px;}
  .stoplist{flex:1;overflow-y:auto;padding:4px 0 30px;}
  .slrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 18px;
    border-bottom:1px solid #f3f5f9;cursor:pointer;}
  .slrow:hover{background:#f5f8ff;}
  .slrow .sn{font-weight:700;color:#20293b;} .slrow .sc{font-size:12px;color:#9aa3b2;}
  .slrow .sd{font-size:11px;font-weight:700;color:#7b8699;background:#eef1f6;border-radius:5px;padding:2px 7px;}
  #page{flex:1;overflow-y:auto;background:var(--bg);padding:26px 20px 60px;}
  .pagewrap{max-width:1100px;margin:0 auto;}
  .pagewrap h1{font-size:24px;margin:0 0 18px;color:#17233b;}
  .guidebox{background:var(--card);border:1px solid #e7ebf1;border-radius:12px;padding:20px 22px;margin-bottom:16px;
    line-height:1.75;color:#3b465c;box-shadow:var(--shadow);}
  .guidebox h3{margin:0 0 8px;font-size:16px;color:#2f6bff;}
  .guidebox ul{margin:6px 0 0;padding-left:18px;} .guidebox li{margin:4px 0;}
  .noticebar{background:var(--card);border:1px solid #e7ebf1;border-radius:12px;padding:16px;margin-bottom:16px;
    display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);}
  .noticebar input{flex:1;padding:10px 12px;border:1px solid #dde3ec;border-radius:8px;font-size:14px;}
  .noticebar button,.writebtn{background:#152a52;color:#fff;border:none;font-weight:700;font-size:14px;
    padding:10px 18px;border-radius:8px;cursor:pointer;}
  .ntable{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;
    box-shadow:var(--shadow);}
  .ntable th{background:#eef1f6;color:#54607a;font-size:13px;font-weight:700;padding:12px;border-bottom:1px solid #e2e7ef;}
  .ntable td{padding:13px 12px;border-bottom:1px solid #f1f3f7;font-size:14px;color:#3b465c;}
  .ntable tr.nrow{cursor:pointer;} .ntable tr.nrow:hover{background:#f5f8ff;}
  .ntable .tt{font-weight:600;color:#20293b;}
  .ntable .empty{text-align:center;color:#9aa3b2;padding:34px;}
  .nbody{white-space:pre-wrap;color:#3b465c;background:#fafbfc;padding:14px;border-radius:8px;margin-top:4px;}
  .ndel{color:#d5495f;background:none;border:none;cursor:pointer;font-size:12px;font-weight:700;}
  .pagefoot{text-align:center;color:#a7b0c0;font-size:12.5px;margin-top:28px;}
  .writeform{background:var(--card);border:1px solid #e7ebf1;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow);}
  .writeform input,.writeform textarea{width:100%;border:1px solid #dde3ec;border-radius:8px;padding:10px 12px;
    font-size:14px;margin-bottom:10px;font-family:inherit;}
  .writeform textarea{min-height:120px;resize:vertical;}
  .mapwrap{position:absolute;inset:0;overflow:hidden;}
  #mapsvg{display:block;width:100%;height:100%;}
  .mapstop{color:var(--orange);cursor:pointer;}      /* orange bus-stop sign */
  .mapstop.next{color:var(--green);} .mapstop.here{color:var(--green);}
  .mroute{fill:none;stroke:#4f74c4;stroke-linejoin:round;stroke-linecap:round;opacity:.85;}
  .mlabel{fill:#17233b;font-weight:800;paint-order:stroke;stroke:#fff;stroke-linejoin:round;
    pointer-events:none;font-family:"Malgun Gothic",sans-serif;}
  #mapsvg{touch-action:none;}   /* let wheel/drag drive zoom & pan */
  .mbus{color:var(--navy);cursor:pointer;}
  .mbus.at{animation:mbob 0.8s ease-in-out infinite;}
  @keyframes mbob{0%,100%{opacity:1;}50%{opacity:.5;}}
  @media (max-width:820px){
    #topnav .navlinks{display:none;}
    #main{flex-direction:column;}
    #sidebar{width:100%;height:42vh;box-shadow:0 2px 10px #0b21440d;}
    #mappane{flex:1;}
  }
  #mappop{position:fixed;z-index:60;background:#fff;border:1px solid #dde3ec;border-radius:10px;
    box-shadow:0 4px 18px #0b214433;padding:10px 12px;font-size:13px;min-width:150px;max-width:230px;}
  #mappop .pt{font-weight:800;margin-bottom:6px;}
  #mappop .pl{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:#3b465c;}
  #mappop .pl b{color:#0f8a4f;} #mappop .pl.far b{color:#c26a12;}
  #mappop .px{position:absolute;top:6px;right:8px;color:#9aa3b2;cursor:pointer;font-weight:700;}
</style>
</head>
<body>
<div id="app">
  <nav id="topnav">
    <div class="brand">🚍 OMSI 버스정보시스템</div>
    <div class="navlinks" id="navlinks"></div>
  </nav>
  <div id="main">
    <aside id="sidebar">
      <div class="sidetabs">
        <span class="sidetab on" data-side="routes">노선현황</span>
        <span class="sidetab" data-side="stops">정류소현황</span>
        <span class="sidetab disabled" title="준비 중입니다">이용안내</span>
      </div>
      <div id="side-routes">
        <header>
          <div class="rownum"><span class="badge" id="badge">일반</span><span class="num" id="num">—</span>
            <button class="editbtn" id="posbtn" title="지도에서 정류장 위치 드래그 수정" hidden>📍 위치</button>
            <button class="editbtn" id="editbtn" title="정류장명 편집">✎ 편집</button></div>
          <div class="ends" id="ends"></div>
          <div class="summary">총 <span id="nstops">0</span>개 정류소 ·
            <span class="run">현재 <span id="running">0</span>대 운행중</span></div>
          <div class="dirtabs" id="dirtabs"></div>
        </header>
        <div class="refresh"><span id="clock"></span><span class="conn bad" id="conn">● 연결 안 됨</span></div>
        <div id="stripview">
          <div class="note" id="note">실제 124번 노선 · 마커는 OMSI 실시간 운행스케줄 기준</div>
          <div class="stops" id="stops"></div>
        </div>
      </div>
      <div id="side-stops" hidden>
        <header><div class="rownum"><span class="num" style="font-size:20px">정류소 검색</span></div>
          <div class="summary">정류소명·번호로 검색해 지도에서 확인</div></header>
        <div class="stopsearchbar"><input id="stopsearch" placeholder="정류소명 또는 번호 입력"></div>
        <div class="stoplist" id="stoplist"></div>
      </div>
    </aside>
    <div id="mappane">
      <div class="mapwrap"><svg id="mapsvg" preserveAspectRatio="xMidYMid meet"></svg></div>
    </div>
  </div>
  <div id="page" hidden></div>
  <div id="mappop" hidden></div>
</div>

<div id="editor" class="modal" hidden>
  <div class="sheet">
    <div class="sheethead">
      <b>정류장명 편집</b>
      <span class="sub">한글 이름을 고치면 관제화면에 바로 반영됩니다.</span>
      <button class="xbtn" id="editclose">✕</button>
    </div>
    <div class="editfilter"><input id="editsearch" placeholder="정류장 검색 (한글·로마자·번호)"></div>
    <div class="editlist" id="editlist"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const stopsEl = $('stops');
let ROUTE = null, rowEls = [];
const busEls = new Map();        // id -> strip element
const mapBusEls = new Map();     // id -> svg marker (map view)
const SVGNS = 'http://www.w3.org/2000/svg';
let GEO = null, lastEta = [];
let EDITABLE = false, posEdit = false, stopDragEl = null, stopDragStart = null;
const posUndo = [];               // stack of {i, prev:[x,y]} for undo of stop moves
const busData = new Map();        // id -> latest bus payload (for the bus-click popup)

const BUS_PATH = "M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-1 1.73V19a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H6v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2.27A2 2 0 0 1 2 15V6a2 2 0 0 1 2-2Zm1 3v4h6V7H5Zm8 0v4h6V7h-6ZM6.5 13.5A1.5 1.5 0 1 0 6.5 16.5 1.5 1.5 0 0 0 6.5 13.5Zm11 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z";
const SVG_BUS = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="${BUS_PATH}"/></svg>`;
// map marker symbols: orange bus-stop sign for stops, navy circle for live buses
const MAP_DEFS = `<defs>
  <symbol id="stopicon" viewBox="-4 -4 32 32">
    <rect x="-3" y="-3" width="30" height="30" rx="8" fill="currentColor" stroke="#fff" stroke-width="3"/>
    <path d="${BUS_PATH}" fill="#fff"/></symbol>
  <symbol id="busicon" viewBox="-5 -5 34 34">
    <circle cx="12" cy="12" r="17" fill="currentColor" stroke="#fff" stroke-width="3"/>
    <path d="${BUS_PATH}" fill="#fff"/></symbol>
</defs>`;

async function loadRoutes(){
  const list = await (await fetch('/api/routes?t='+Date.now(), {cache:'no-store'})).json();
  const tabs = $('dirtabs'); tabs.innerHTML='';
  list.forEach(r=>{
    const t=document.createElement('div'); t.className='dirtab';
    t.textContent = r.dir==='up' ? '상행' : '하행';
    t.dataset.key = r.key; t.onclick = ()=>selectRoute(r.key);
    tabs.appendChild(t);
  });
  await selectRoute(list[0].key);
}

async function selectRoute(key){
  document.querySelectorAll('.dirtab').forEach(t=>t.classList.toggle('on', t.dataset.key===key));
  ROUTE = await (await fetch('/api/route/'+key+'?t='+Date.now(), {cache:'no-store'})).json();
  $('badge').textContent = ROUTE.type || '일반';
  $('badge').className = 'badge' + (ROUTE.type==='간선'?' trunk':'');
  $('num').textContent = ROUTE.no;
  $('ends').textContent = `${ROUTE.from} ↔ ${ROUTE.to}`;
  $('nstops').textContent = ROUTE.stops.length;
  stopsEl.querySelectorAll('.stop').forEach(e=>e.remove());
  for(const [,e] of busEls) e.remove(); busEls.clear();   // markers re-place on next tick
  rowEls = ROUTE.stops.map(s=>{
    const row=document.createElement('div'); row.className='stop';
    row.innerHTML=`<div class="rail"><div class="node">▾</div></div>
      <div class="info"><div class="sname">${s.kname||s.name}</div><div class="scode">${s.id}</div></div>
      <div class="eta"></div>`;
    stopsEl.appendChild(row); return row;
  });
  renderMapBase();   // rebuild the map for the new direction
}

function ensureBus(id){
  let e=busEls.get(id);
  if(!e){ e=document.createElement('div'); e.className='bus';
    e.innerHTML=`${SVG_BUS}<span class="tag"></span>`; stopsEl.appendChild(e); busEls.set(id,e); }
  return e;
}

function nodeY(i){
  const base = stopsEl.getBoundingClientRect().top - stopsEl.scrollTop;
  return rowEls[i].querySelector('.node').getBoundingClientRect().top - base + 13;
}

const ETA_WINDOW = 8;      // only annotate stops within this many stops of a bus
const AVG_MPS = 5.2;       // assumed effective city-bus speed (~19 km/h incl. stops)

function apply(buses){
  // a bus only belongs on the strip of the direction it's actually running
  buses = buses.filter(b => (b.dir||null) === ROUTE.dir);
  $('running').textContent = buses.length;
  busData.clear(); for(const b of buses) busData.set(b.id, b);
  const alive=new Set();
  // eta[j] = nearest incoming bus to stop j: {n stops away, remain metres, at-station}
  const eta = new Array(ROUTE.stops.length).fill(null);
  const pl = [];   // {b,i,f,atStop} — shared placement for strip + map
  for(const b of buses){ alive.add(b.id);
    const e=ensureBus(b.id);
    e.querySelector('.tag').textContent=(b.line?`[${b.line}] `:'')+(b.nick||b.id);
    // OMSI schedule: bus is heading to stop `nextIdCode`, coming from the previous
    // stop; the exact position is OMSI's own prev/next distance ratio.
    let top = null;
    const i = (b.schedValid && b.nextIdCode)
      ? ROUTE.stops.findIndex(s => String(s.id) === String(b.nextIdCode)) : -1;
    if(i >= 0){
      const nd = b.nextDist||0, pd = b.prevDist||0;
      const f = (pd+nd) > 0 ? pd/(pd+nd) : 0;   // 0 = at prev stop, 1 = at next stop
      const atStop = (b.atStation||0) > 0.5;
      top = (i === 0) ? nodeY(0) : nodeY(i-1) + (nodeY(i)-nodeY(i-1))*f;
      e.classList.toggle('at', atStop);
      pl.push({b, i, f, atStop});
      // this bus is (j - i) stops away from every stop j ahead of it (incl. j==i).
      // remaining distance = metres to its own next stop + stop-to-stop cumulative.
      for(let j=i; j<ROUTE.stops.length && j-i<=ETA_WINDOW; j++){
        const n = j - i;
        const remain = nd + (ROUTE.stops[j].dist - ROUTE.stops[i].dist);
        if(!eta[j] || remain < eta[j].remain) eta[j] = {n, remain, at: atStop && n===0};
      }
    }
    // no valid schedule position: keep the marker where it was (avoids a flicker
    // teleporting it), or park it at the first stop until OMSI reports a schedule.
    if(top !== null){ e.style.top = top + 'px'; e.dataset.placed = '1'; }
    else if(!e.dataset.placed){ e.style.top = nodeY(0) + 'px'; }
  }
  for(const [id,e] of busEls){ if(!alive.has(id)){ e.remove(); busEls.delete(id); } }
  lastEta = eta;
  renderEta(eta);
  updateMapBuses(pl, alive);
}

async function loadGeo(){
  try{ GEO = await (await fetch('/api/geo?t='+Date.now(), {cache:'no-store'})).json(); }
  catch(e){ GEO = null; }

// build the static map layer (background + route + orange stop signs + labels)
function renderMapBase(){
  const svg = $('mapsvg');
  if(!GEO || !ROUTE || !GEO[ROUTE.dir]){ svg.innerHTML=''; return; }
  const g = GEO[ROUTE.dir];
  const pts = g.path.map(p=>p.join(',')).join(' ');
  let dots='', labels='';
  g.stops.forEach((s,i)=>{ const nm = ROUTE.stops[i] ? (ROUTE.stops[i].kname||ROUTE.stops[i].name) : '';
    const [x,y]=s.xy;
    dots   += `<use href="#stopicon" class="mapstop" data-cx="${x}" data-cy="${y}" data-i="${i}"><title>${nm}</title></use>`;
    labels += `<text class="mlabel" data-cx="${x}" data-cy="${y}" data-i="${i}" text-anchor="middle" style="display:none">${nm}</text>`; });
  svg.innerHTML = MAP_DEFS
    + `<image href="/geo_bg.png" x="0" y="0" width="${GEO.W}" height="${GEO.H}"/>`
    + `<polyline class="mroute" points="${pts}"/>`
    + `<g id="mapstops">${dots}</g><g id="maplabels">${labels}</g><g id="mapbuses"></g>`;
  mapBusEls.clear();
  svg.querySelectorAll('.mapstop').forEach(c=>{
    c.addEventListener('click', ev=>{ if(!_dragged) showStopPopup(+c.dataset.i, ev); });
    c.addEventListener('contextmenu', ev=>{ if(posEdit){ ev.preventDefault(); resetStop(+c.dataset.i); } });
  });
  initMapView();          // fit whole route, then zoom/pan takes over
}

// undo the last stop move / reset a stop to its original (spline) position
function undoStopMove(){
  const u = posUndo.pop(); if(!u) return;
  const el = $('mapsvg').querySelector(`.mapstop[data-i="${u.i}"]`); if(!el) return;
  moveStop(el, u.prev[0], u.prev[1]); saveStopPos(el);
}
function resetStop(i){
  const st = ROUTE.stops[i]; if(!st) return;
  fetch('/api/stoppos/reset', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({dir:ROUTE.dir, id:String(st.id)})}).then(r=>r.json()).then(j=>{
    if(j && j.xy){ const el=$('mapsvg').querySelector(`.mapstop[data-i="${i}"]`); if(el) moveStop(el, j.xy[0], j.xy[1]); }
  }).catch(()=>{});
}

// ── zoom & pan (viewBox), with markers/labels kept at constant screen size ──
let vb = null, baseVB = null, mScale = 1;
const STOP_PX = 17, BUS_PX = 30, ROUTE_PX = 4, LABEL_PX = 12;

function paneSize(){ const p = $('mappane'); return {w: p.clientWidth||1, h: p.clientHeight||1}; }

function initMapView(){
  const {w:pw, h:ph} = paneSize(), ar = pw/ph;
  baseVB = {x:0, y:0, w:GEO.W, h:GEO.H};
  let w, h;                                   // fit the whole map, matching pane aspect (no letterbox)
  if(ar > GEO.W/GEO.H){ h = GEO.H; w = h*ar; } else { w = GEO.W; h = w/ar; }
  vb = {x:(GEO.W-w)/2, y:(GEO.H-h)/2, w, h};
  applyView();
}

function applyView(){
  const svg = $('mapsvg'); if(!vb) return;
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  mScale = vb.w / paneSize().w;               // world units per on-screen pixel
  const ss = STOP_PX*mScale, bs = BUS_PX*mScale;
  svg.querySelectorAll('.mapstop').forEach(u=>{ const cx=+u.dataset.cx, cy=+u.dataset.cy;
    u.setAttribute('x',cx-ss/2); u.setAttribute('y',cy-ss/2); u.setAttribute('width',ss); u.setAttribute('height',ss); });
  svg.querySelectorAll('.mbus').forEach(u=>{ const cx=+u.dataset.cx, cy=+u.dataset.cy;
    u.setAttribute('x',cx-bs/2); u.setAttribute('y',cy-bs/2); u.setAttribute('width',bs); u.setAttribute('height',bs); });
  const rt = svg.querySelector('.mroute'); if(rt) rt.setAttribute('stroke-width', ROUTE_PX*mScale);
  const show = posEdit || vb.w < baseVB.w*0.55;   // labels when zoomed in, or while editing positions
  svg.querySelectorAll('.mlabel').forEach(t=>{
    if(!show){ t.style.display='none'; return; }
    t.style.display=''; t.setAttribute('font-size', LABEL_PX*mScale);
    t.setAttribute('x', +t.dataset.cx); t.setAttribute('y', +t.dataset.cy - ss*0.8);
    t.setAttribute('stroke-width', 3*mScale);
  });
}

let _mapWired = false;
function setupMapInteraction(){
  if(_mapWired) return; _mapWired = true;
  const svg = $('mapsvg');
  svg.addEventListener('wheel', e=>{
    if(!vb) return; e.preventDefault();
    const r = svg.getBoundingClientRect();
    const fx=(e.clientX-r.left)/r.width, fy=(e.clientY-r.top)/r.height;
    const wx=vb.x+fx*vb.w, wy=vb.y+fy*vb.h, ar=paneSize().w/paneSize().h;
    let nw = vb.w*(e.deltaY<0?0.83:1/0.83);
    nw = Math.min(baseVB.w, Math.max(GEO.W*0.05, nw));   // zoom range
    const nh = nw/ar;
    vb.x=wx-fx*nw; vb.y=wy-fy*nh; vb.w=nw; vb.h=nh; applyView();
  }, {passive:false});
  let drag=null, moved=false;
  svg.addEventListener('pointerdown', e=>{ if(!vb) return;
    const st = posEdit ? e.target.closest('.mapstop') : null;   // admin: drag a stop
    if(st){ stopDragEl=st; stopDragStart=[+st.dataset.cx, +st.dataset.cy]; moved=false; e.preventDefault(); return; }
    drag={x:e.clientX,y:e.clientY}; moved=false; svg.style.cursor='grabbing'; });
  svg.addEventListener('pointermove', e=>{ if(!vb) return; const r=svg.getBoundingClientRect();
    if(stopDragEl){ moved=true;
      moveStop(stopDragEl, vb.x+(e.clientX-r.left)/r.width*vb.w, vb.y+(e.clientY-r.top)/r.height*vb.h); return; }
    if(!drag) return;
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>3) moved=true;
    vb.x-=(e.clientX-drag.x)/r.width*vb.w; vb.y-=(e.clientY-drag.y)/r.height*vb.h;
    drag={x:e.clientX,y:e.clientY}; applyView(); });
  const end=()=>{
    if(stopDragEl){
      if(moved && stopDragStart) posUndo.push({i:+stopDragEl.dataset.i, prev:stopDragStart});
      saveStopPos(stopDragEl); stopDragEl=null; stopDragStart=null; setTimeout(()=>{ _dragged=true; }, 0); return; }
    drag=null; svg.style.cursor=posEdit?'move':'grab'; setTimeout(()=>{ _dragged=moved; }, 0); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  window.addEventListener('resize', ()=>{ if(vb) initMapView(); });
  svg.style.cursor='grab';
}
let _dragged = false;

// admin: move a stop marker (+ its label) live, and remember the new position
function moveStop(el, wx, wy){
  const svg=$('mapsvg'), i=+el.dataset.i, ss=STOP_PX*mScale;
  el.dataset.cx=wx; el.dataset.cy=wy;
  el.setAttribute('x', wx-ss/2); el.setAttribute('y', wy-ss/2);
  const lbl=svg.querySelector(`.mlabel[data-i="${i}"]`);
  if(lbl){ lbl.dataset.cx=wx; lbl.dataset.cy=wy; lbl.setAttribute('x', wx); lbl.setAttribute('y', wy-ss*0.8); }
  if(GEO && GEO[ROUTE.dir]) GEO[ROUTE.dir].stops[i].xy=[wx,wy];   // buses interpolate on new pos
}
function saveStopPos(el){
  const i=+el.dataset.i, st=ROUTE.stops[i];
  if(!st) return;
  fetch('/api/stoppos', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({dir:ROUTE.dir, id:String(st.id), x:+el.dataset.cx, y:+el.dataset.cy})})
    .then(r=>{ if(!r.ok) r.json().then(j=>console.error('위치 저장 실패', j)); });
}

function updateMapBuses(pl, alive){
  if(!GEO || !ROUTE || !GEO[ROUTE.dir]) return;
  const g = GEO[ROUTE.dir];
  const svg = $('mapsvg'), layer = svg.querySelector('#mapbuses');
  if(!layer) return;
  svg.querySelectorAll('.mapstop').forEach(c=>c.classList.remove('next','here'));
  for(const {b,i,f,atStop} of pl){
    const a = g.stops[Math.max(0,i-1)].xy, c = g.stops[i].xy;
    const t = (i===0) ? 0 : f;
    const x = a[0]+(c[0]-a[0])*t, y = a[1]+(c[1]-a[1])*t;
    let el = mapBusEls.get(b.id);
    if(!el){ el=document.createElementNS(SVGNS,'use'); el.setAttribute('href','#busicon'); el.setAttribute('class','mbus');
      el.appendChild(document.createElementNS(SVGNS,'title')); layer.appendChild(el); mapBusEls.set(b.id,el);
      el.addEventListener('click', ev=>{ ev.stopPropagation(); if(!_dragged) showBusPopup(b.id, ev); }); }
    const bs = BUS_PX*mScale;
    el.dataset.cx = x; el.dataset.cy = y;
    el.setAttribute('x', x-bs/2); el.setAttribute('y', y-bs/2); el.setAttribute('width', bs); el.setAttribute('height', bs);
    el.classList.toggle('at', atStop);
    el.querySelector('title').textContent=(b.line?`[${b.line}] `:'')+(b.nick||b.id);
    const dot = svg.querySelector(`.mapstop[data-i="${i}"]`);
    if(dot) dot.classList.add(atStop?'here':'next');
  }
  for(const [id,el] of mapBusEls){ if(!alive.has(id)){ el.remove(); mapBusEls.delete(id); } }
}

// stop tap -> Korean-BIS style arrival popup (uses the same ETA as the strip)
function showStopPopup(i, ev){
  const pop = $('mappop'), st = ROUTE.stops[i];
  const nm = st ? (st.kname||st.name) : ('#'+i), s = lastEta[i];
  let body;
  if(!s) body = '<div class="pl">접근 중인 버스 없음</div>';
  else{
    const mins = Math.max(1, Math.round(s.remain/(AVG_MPS*60)));
    const label = s.at ? '<b>도착</b>' : (s.n===0 ? '<b>곧 도착</b>' : `<b>${s.n}정류장 전</b> · 약 ${mins}분 후`);
    body = `<div class="pl ${s.n>0?'far':''}">${label}</div>`;
  }
  pop.innerHTML = `<span class="px">✕</span><div class="pt">${nm}</div>${body}`;
  pop.querySelector('.px').onclick = ()=>pop.hidden=true;
  placePop(ev);
}

// bus tap -> running-bus info (route / driver / next stop), like the 김제 BIS card
function showBusPopup(id, ev){
  const b = busData.get(id); if(!b) return;
  const pop = $('mappop');
  const line = b.line || '—', nick = b.nick || b.id;
  const next = b.schedValid ? (b.nextName||'') : '';
  pop.innerHTML = `<span class="px">✕</span>
    <div style="color:#8a93a6;font-size:11.5px;font-weight:700">운행버스정보</div>
    <div style="display:flex;align-items:baseline;gap:8px;margin:3px 0 7px">
      <span class="badge">일반</span>
      <span style="font-size:23px;font-weight:800;color:#2f6bff;letter-spacing:-.5px">${line}</span></div>
    <div class="pl"><span>기사</span><b style="color:#20293b">${nick}</b></div>
    ${next?`<div class="pl"><span>다음 정류장</span><b style="color:#0f8a4f">${next}</b></div>`:
           `<div class="pl"><span style="color:#c26a12">운행 스케줄 없음</span></div>`}`;
  pop.querySelector('.px').onclick = ()=>pop.hidden=true;
  placePop(ev);
}

function placePop(ev){
  const pop = $('mappop');
  pop.hidden = false;
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(6, Math.min(window.innerWidth - w - 6, ev.clientX + 10)) + 'px';
  pop.style.top  = Math.max(6, Math.min(window.innerHeight - h - 6, ev.clientY + 10)) + 'px';
}

// Korean BIS-style arrival text on each stop + highlight of the approached node
function renderEta(eta){
  for(let j=0;j<rowEls.length;j++){
    const badge = rowEls[j].querySelector('.eta');
    const node  = rowEls[j].querySelector('.node');
    node.classList.remove('next','here');
    const s = eta[j];
    if(!s){ badge.innerHTML=''; badge.className='eta'; continue; }
    const mins = Math.round(s.remain / (AVG_MPS*60));
    if(s.at){
      badge.innerHTML='<b>도착</b>'; badge.className='eta here'; node.classList.add('here');
    } else if(s.n===0){
      badge.innerHTML='<b>곧 도착</b>'; badge.className='eta soon'; node.classList.add('next');
    } else {
      badge.innerHTML=`<b>${s.n}정류장 전</b><small>약 ${Math.max(1,mins)}분 후 도착</small>`;
      badge.className='eta far';
    }
  }
}

let EDIT_STOPS = [];
const DIRLABEL = {up:'상행', down:'하행'};

async function openEditor(){
  EDIT_STOPS = await (await fetch('/api/stops?t='+Date.now(), {cache:'no-store'})).json();
  $('editsearch').value = '';
  renderEditList('');
  $('editor').hidden = false;
}
function closeEditor(){ $('editor').hidden = true; }

function renderEditList(q){
  q = (q||'').trim().toLowerCase();
  const list = $('editlist'); list.innerHTML = '';
  for(const s of EDIT_STOPS){
    if(q && !(`${s.kname} ${s.name} ${s.id}`.toLowerCase().includes(q))) continue;
    const row = document.createElement('div'); row.className = 'erow';
    row.innerHTML =
      `<div class="meta"><div class="romaji" title="${s.name}">${s.name||'—'}</div>
         <div class="eid">${s.id}</div>
         <span class="dir">${s.dirs.map(d=>DIRLABEL[d]||d).join('·')}</span></div>
       <input value="${s.kname.replace(/"/g,'&quot;')}">
       <button class="save">저장</button>`;
    const input = row.querySelector('input');
    const btn = row.querySelector('.save');
    const commit = ()=>saveKname(s, input.value, row, btn);
    btn.onclick = commit;
    input.onkeydown = ev => { if(ev.key==='Enter') commit(); };
    list.appendChild(row);
  }
  if(!list.children.length) list.innerHTML = '<div style="padding:20px;color:#8a93a6">검색 결과 없음</div>';
}

async function saveKname(s, value, row, btn){
  const kname = value.trim();
  if(!kname || kname === s.kname){ return; }
  btn.disabled = true; btn.textContent = '저장중';
  try{
    const res = await fetch('/api/kname', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id:s.id, kname})});
    if(!res.ok) throw new Error((await res.json()).error||res.status);
    s.kname = kname;
    row.classList.add('saved'); btn.textContent = '완료';
    setTimeout(()=>{ row.classList.remove('saved'); btn.textContent='저장'; btn.disabled=false; }, 1200);
    if(ROUTE) selectRoute(ROUTE.key);        // reflect the change on the live strip
  }catch(err){
    btn.textContent = '실패'; btn.disabled = false;
    setTimeout(()=>{ btn.textContent='저장'; }, 1500);
    console.error('save failed', err);
  }
}

    <div>
      <div class="homebrand">🚍 OMSI 버스정보시스템</div>
      <form class="homesearch" id="homesearch"><input id="homeq" placeholder="노선번호 · 정류소명 · 정류소번호 검색"><button type="submit">🔍</button></form>
      <div class="homehint">예) 124, 석교, 8573</div>
      <div class="tiles">
        <div class="tile search" data-go="app"><div class="ic">🔍</div><div class="tl">통합검색</div></div>
        <div class="tile off"><div class="ic">ℹ️</div><div class="tl">이용안내 (준비중)</div></div>
        <div class="tile notice" data-go="notices"><div class="ic">📢</div><div class="tl">공지사항</div></div>
        <div class="tile tel"><div class="ic">☎️</div><div class="tl">문의 1588-0000</div></div>
      </div>
    </div>
    <div class="herobox"><div style="text-align:center"><div class="bus">🚍</div>
      <div class="h1">OMSI SHARED BIS</div><div class="h2">모두의 노선을 잇는<br>실시간 버스정보</div></div></div>
  </div></div>`;
  $('page').querySelectorAll('.tile[data-go]').forEach(t=>t.onclick=()=>setPage(t.dataset.go));
  $('homesearch').onsubmit=e=>{ e.preventDefault(); const q=$('homeq').value.trim();
    setPage('app'); if(q){ setSide('stops'); $('stopsearch').value=q; renderStopList(q); } };
}

const esc = s => (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 정류소현황: search stops, click to focus the map on one
function renderStopList(q){
  q=(q||'').trim().toLowerCase(); const el=$('stoplist'); el.innerHTML='';
  if(!ROUTE) return;
  ROUTE.stops.forEach((s,i)=>{ const nm=s.kname||s.name;
    if(q && !(`${nm} ${s.id}`.toLowerCase().includes(q))) return;
    const r=document.createElement('div'); r.className='slrow';
    r.innerHTML=`<div><div class="sn">${esc(nm)}</div><div class="sc">${s.id}</div></div>`+
      `<span class="sd">${ROUTE.dir==='up'?'상행':'하행'} ${i+1}</span>`;
    r.onclick=()=>focusStop(i); el.appendChild(r);
  });
  if(!el.children.length) el.innerHTML='<div style="padding:22px;color:#9aa3b2">검색 결과 없음</div>';
}
function focusStop(i){
  if(!GEO || !GEO[ROUTE.dir] || !baseVB) return;
  const xy=GEO[ROUTE.dir].stops[i].xy, ar=paneSize().w/paneSize().h, w=Math.min(baseVB.w, 700);
  vb={x:xy[0]-w/2, y:xy[1]-(w/ar)/2, w, h:w/ar}; applyView();
  const r=$('mapsvg').getBoundingClientRect();
  showStopPopup(i, {clientX:r.left+r.width/2, clientY:r.top+r.height*0.4});
}

// 이용안내

    <div class="guidebox"><h3>🚌 버스정보시스템 이용안내</h3>
      OMSI 버스정보시스템은 접속한 운전자들의 버스를 실시간으로 지도에 표시합니다.
      도착예정정보는 OMSI 운행 스케줄 기반 예측정보로, 실제 도착과 차이가 있을 수 있습니다.<br>
      ※ 운행 대수·시간은 현재 접속한 운전자에 따라 달라집니다.</div>
    <div class="guidebox"><h3>사용 방법</h3>
      <ul><li><b>노선현황</b> — 상행/하행을 골라 정류장 목록과 지도에서 실시간 버스를 확인합니다.</li>
      <li><b>정류소현황</b> — 정류소명·번호로 검색해 지도에서 위치·도착정보를 봅니다.</li>
      <li>지도의 <b>정류장(주황)</b>을 클릭하면 도착안내, <b>버스(남색)</b>를 클릭하면 운행버스정보가 뜹니다.</li>
      <li>지도는 마우스 휠로 <b>확대/축소</b>, 드래그로 <b>이동</b>할 수 있습니다.</li></ul></div></div>`;
}

// 공지사항 — 열람은 누구나, 작성/삭제는 관리자(로컬)만
let noticesCache=[];
async function loadNotices(){
  try{ noticesCache = await (await fetch('/api/notices?t='+Date.now(), {cache:'no-store'})).json(); }
  catch(e){ noticesCache=[]; }
  renderNotices('');
}
function renderNotices(q){
  q=(q||'').trim(); const ql=q.toLowerCase();
  const items=noticesCache.filter(n=>!ql || (n.title+' '+n.body).toLowerCase().includes(ql));
  const cols = EDITABLE?4:3;
  const rows = items.length ? items.map(n=>`
    <tr class="nrow" data-id="${n.id}"><td style="text-align:center;color:#9aa3b2">${n.id}</td>
      <td class="tt">${esc(n.title)}</td><td style="text-align:center;color:#9aa3b2">${esc(n.date||'')}</td>
      ${EDITABLE?`<td style="text-align:center"><button class="ndel" data-del="${n.id}">삭제</button></td>`:''}</tr>
    <tr data-body="${n.id}" hidden><td colspan="${cols}"><div class="nbody">${esc(n.body)||'(내용 없음)'}</div></td></tr>`).join('')
    : `<tr><td class="empty" colspan="${cols}">등록된 공지사항이 없습니다.</td></tr>`;
  $('page').innerHTML = `<div class="pagewrap"><h1>공지사항</h1>
    <div class="noticebar"><input id="nsearch" placeholder="검색어를 입력하세요" value="${esc(q)}">
      <button id="nsearchbtn">검색</button>
      ${EDITABLE?'<button class="writebtn" id="nwrite">✎ 글쓰기</button>':''}</div>
    <div id="nwriteform"></div>
    <table class="ntable"><thead><tr><th style="width:70px">번호</th><th>제목</th>
      <th style="width:130px">등록일</th>${EDITABLE?'<th style="width:64px"></th>':''}</tr></thead>
      <tbody>${rows}</tbody></table>
    <div class="pagefoot">OMSI 버스정보시스템 · 공지는 관리자만 작성할 수 있습니다.</div></div>`;
  $('nsearchbtn').onclick=()=>renderNotices($('nsearch').value);
  $('nsearch').onkeydown=e=>{ if(e.key==='Enter') renderNotices($('nsearch').value); };
  document.querySelectorAll('.nrow').forEach(tr=>tr.onclick=ev=>{
    if(ev.target.dataset.del!==undefined) return;
    const d=$('page').querySelector(`[data-body="${tr.dataset.id}"]`); if(d) d.hidden=!d.hidden; });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); delNotice(+b.dataset.del); });
  if(EDITABLE && $('nwrite')) $('nwrite').onclick=toggleWriteForm;
}
function toggleWriteForm(){
  const f=$('nwriteform');
  if(f.innerHTML){ f.innerHTML=''; return; }
  f.innerHTML=`<div class="writeform"><input id="ntitle" placeholder="제목" maxlength="200">
    <textarea id="nbody" placeholder="내용을 입력하세요"></textarea>
    <button class="writebtn" id="nsave">등록</button></div>`;
  $('nsave').onclick=saveNotice; $('ntitle').focus();
}
async function saveNotice(){
  const title=$('ntitle').value.trim(), body=$('nbody').value;
  if(!title){ $('ntitle').focus(); return; }
  const r=await fetch('/api/notices',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title,body})});
  if(r.ok){ await loadNotices(); }
  else { const j=await r.json().catch(()=>({})); alert('등록 실패: '+(j.error||r.status)); }
}
async function delNotice(id){
  if(!confirm('이 공지를 삭제할까요?')) return;
  const r=await fetch('/api/notices/'+id,{method:'DELETE'});
  if(r.ok) await loadNotices();
}
$('stopsearch').oninput=e=>renderStopList(e.target.value);

function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  const ws=new WebSocket(`${proto}://${location.host}/ws`);
  const c=$('conn');
  ws.onopen=()=>{c.textContent='● 실시간';c.className='conn ok';};
  ws.onclose=()=>{c.textContent='● 연결 끊김';c.className='conn bad';setTimeout(connect,1000);};
  ws.onmessage=e=>{ if(ROUTE) apply((JSON.parse(e.data).buses)||[]); };
}
loadRoutes().then(loadGeo).then(connect);
</script>
